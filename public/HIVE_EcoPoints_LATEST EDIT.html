.card{background:color-mix(in srgb,var(--card) 84%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh)}

.sso{display:flex;flex-direction:column;gap:8px;margin:12px 0}.sso .btn{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600}.sso svg{width:20px;height:20px;flex:none}

.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 17px Sora;color:#fff;background:linear-gradient(135deg,var(--g),var(--g2));flex:none;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.tc ol{padding-left:20px;margin:10px 0 14px}.tc li{margin-bottom:9px;font-size:14px}

:root[data-theme=dark] :is(.lv .ic,.nav span,[style*="font-size:26px"],[style*="font-size:30px"],[style*="font-size:32px"],[style*="font-size:34px"],[style*="font-size:38px"]){filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}

/* ===== HIVE EcoPoints professional design system ===== */

:root[data-theme=light]{--bg:#F5F7F5;--card:#FFFFFF;--ink:#17251F;--mut:#64736B;--g:#167A5B;--g2:#105840;--lime:#D8F5A5;--line:#E0E7E2;--soft:#EAF4EE;--sh:0 8px 28px rgba(21,52,38,.07);color-scheme:light}
:root[data-theme=dark]{--bg:#101916;--card:#18231E;--ink:#EDF4EF;--mut:#A5B5AC;--g:#67D3A4;--g2:#8BE0B8;--lime:#D8F5A5;--line:#2B3A32;--soft:#22362B;--sh:0 10px 32px rgba(0,0,0,.22);color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:Manrope,Inter,system-ui,sans-serif;letter-spacing:-.012em}
body::before{opacity:.22!important;filter:blur(42px)}body::after{opacity:.055!important}
h1,h2,h3{letter-spacing:-.035em}h2{font-size:clamp(20px,2vw,25px)}
header{background:color-mix(in srgb,var(--bg) 92%,transparent);border-color:var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.bar{padding-top:12px;padding-bottom:12px}.brand{gap:10px;font-size:inherit;letter-spacing:-.03em}.brand svg{width:42px;height:42px;filter:none}.brand-copy{display:flex;flex-direction:column;line-height:1.05;gap:4px}.brand-copy strong{font:800 17px Sora,sans-serif;letter-spacing:.02em}.brand-copy small{font:600 11px Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.chip{border-radius:10px;padding:8px 13px;font-size:12px;box-shadow:none!important}.chip.on{background:var(--g2);color:#fff;border-color:var(--g2);box-shadow:none!important}
.card{background:var(--card);border-color:var(--line);backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:18px;box-shadow:var(--sh);padding:20px}
.grid,.qa{gap:16px}.btn{border-radius:10px;background:var(--g);box-shadow:none;font-weight:700}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(22,122,91,.16)}.btn.alt{background:var(--soft);color:var(--g2);border:1px solid var(--line)}.btn.big{background:var(--g);border-radius:11px;box-shadow:none}.btn.lg{background:var(--soft);color:var(--g2);box-shadow:none}
.hero2{border-radius:22px;box-shadow:0 18px 46px rgba(8,45,31,.16);min-height:365px;padding:clamp(26px,4vw,48px);margin-top:10px}.hero2::before{background:linear-gradient(90deg,rgba(6,31,23,.88),rgba(6,31,23,.60) 62%,rgba(6,31,23,.22))}.hero2 .bg{background-position:center 48%;transform:none!important}.hero2 h1{max-width:720px;font-size:clamp(32px,4.4vw,54px);line-height:1.04}.hero2 p{max-width:590px;font-size:clamp(15px,1.6vw,18px)}.live{letter-spacing:.03em;text-transform:uppercase;font-size:10px}
/* Remove prototype "Live" labels across all pages. */
.live{display:none!important}
.glass{border-radius:18px;background:rgba(13,43,32,.56);border-color:rgba(255,255,255,.25);backdrop-filter:blur(12px);box-shadow:0 12px 34px rgba(0,0,0,.14)}.glass .lgo{animation:none}.gbar i{background:linear-gradient(90deg,#72D7A8,#D8F5A5)}
.qa-i{border-radius:15px;box-shadow:none;background:var(--card);border-color:var(--line)}.qa-i:hover{transform:translateY(-2px);box-shadow:var(--sh)}.ib{border-radius:12px;background:var(--soft);color:var(--g2);font-size:inherit}.act{border-radius:16px}.act:hover{transform:translateY(-3px);box-shadow:var(--sh)}.pic{height:165px;background:#DDE9E1}.pic img{transition:transform .45s ease}.pic::after{background:linear-gradient(180deg,transparent 58%,rgba(4,24,16,.36))}.pic .em{background:rgba(255,255,255,.96);color:#145A42;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.pill{background:var(--soft);color:var(--g2);font-size:11px;letter-spacing:.01em}.pill.y{background:#FFF3D7;color:#79530A}.pill.gr{background:#DDF6E7;color:#17613D}.pill.r{background:#FCE4E4;color:#922E2E}:root[data-theme=dark] .pill.y{background:#49391C;color:#F5D48A}:root[data-theme=dark] .pill.gr{background:#1E4431;color:#A5E7BC}:root[data-theme=dark] .pill.r{background:#4B2929;color:#FFB5B5}
input,select,textarea{border-radius:10px;background:var(--card);border-color:var(--line)}.modal{background:rgba(5,15,10,.62)}.modal .card{border-radius:18px}.toast{border-radius:12px;background:var(--g2)}.nav{background:var(--card);border-color:var(--line)}.nav button.on{color:var(--g)}.nav span{display:grid;place-items:center}
.sw{background:#E4ECE6;box-shadow:none}.sw .k{box-shadow:0 1px 4px rgba(0,0,0,.16)}:root[data-theme=dark] .sw{background:#2B4135}
/* Replace platform-dependent emoji glyphs with consistent vector icons. */
.ui-icon{display:inline-grid;place-items:center;width:1.18em;height:1.18em;vertical-align:-.22em;flex:none;color:var(--g2)}.ui-icon svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ib .ui-icon{width:25px;height:25px}.pic .ui-icon{width:25px;height:25px}.nav .ui-icon{width:21px;height:21px}.lv .ic .ui-icon{width:26px;height:26px}.rw .md .ui-icon{width:22px;height:22px}.glass .ui-icon{color:inherit}
img{background:var(--soft)}img.fi{transition:opacity .24s ease}img.fi.ok{opacity:1}.ph img,.rw .th img{display:block;object-fit:cover}.ph{background:var(--soft)}

mission:()=>`<h2>Mission &amp; Vision</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><div style="font-size:34px">🎯</div><h3>Our Mission</h3><p class="mut">To inspire every student to take small, real eco-friendly actions every day, and to recognise and reward those actions so that caring for the environment becomes a lasting habit.</p><p class="mut">Eco Points turns good intentions into visible progress. Every tree planted, every bag of litter collected and every bottle recycled is verified, counted and celebrated, so students can see the difference they make.</p><h3 style="margin-top:14px">What we commit to</h3><ul class="mut" style="padding-left:18px;margin:6px 0 0"><li>Make eco action simple, fun and rewarding for every student.</li><li>Recognise genuine effort fairly, through verified proof.</li><li>Build habits that last beyond a single drive or event.</li><li>Work with colleges, faculty and coordinators to keep campuses clean and green.</li></ul></div><div class="card"><div style="font-size:34px">🌍</div><h3>Our Vision</h3><p class="mut">A generation of Green Champions and campuses where sustainable living is the norm, and where every small action adds up to a cleaner, greener planet.</p><p class="mut">We imagine colleges and schools where students lead by example, where plastic use keeps falling and tree cover keeps growing, and where the green habits learned here follow students into their homes, jobs and communities.</p><h3 style="margin-top:14px">What success looks like</h3><ul class="mut" style="padding-left:18px;margin:6px 0 0"><li>Every student knows simple ways to protect the environment.</li><li>Campuses with less waste, less single-use plastic and more trees.</li><li>A community of students who inspire their families and neighbours.</li><li>Eco-friendly choices that become second nature for life.</li></ul></div></div><h2 style="margin-top:28px">Frequently Asked Questions</h2>${FAQ.map(f=>`<deta
